name: Build and Push Docker Image

on:
  push:
    branches: ["main", "master"]
    paths:
      - "Dockerfile"
      - "start-rdp.sh"
      - "VERSION"
      - "README.md"
      - ".github/workflows/dockerhub.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "Dockerfile"
      - "start-rdp.sh"
      - "VERSION"
      - "README.md"
      - ".github/workflows/dockerhub.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: yotzee/coder

jobs:
  build:
    runs-on: ubuntu-latest
    environment: docker_build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "$NEW_VERSION" > VERSION
          echo "Bumped version: $VERSION → $NEW_VERSION"

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push version bump
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push
