stages:
  - build

variables:
  IMAGE_NAME: yotzee/coder
  DOCKER_TLS_CERTDIR: "/certs"

build-and-push:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  environment:
    name: docker_build
  before_script:
    - docker buildx create --use
  script:
    - |
      VERSION=$(cat VERSION | tr -d '\n')
      echo "Building version ${VERSION}"

      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        PUSH_FLAG="--push"
        CACHE_TO="--cache-to type=registry,ref=${IMAGE_NAME}:buildcache,mode=max"
      else
        PUSH_FLAG=""
        CACHE_TO=""
      fi

      docker buildx build \
        ${PUSH_FLAG} \
        --tag "${IMAGE_NAME}:latest" \
        --tag "${IMAGE_NAME}:${VERSION}" \
        --tag "${IMAGE_NAME}:${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --cache-from "type=registry,ref=${IMAGE_NAME}:buildcache" \
        ${CACHE_TO} \
        .
  rules:
    # Merge requests targeting main/master - only when relevant files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - start-rdp.sh
        - VERSION
        - README.md
        - .gitlab-ci.yml
    # Pushes to main/master - only when relevant files change
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      changes:
        - Dockerfile
        - start-rdp.sh
        - VERSION
        - README.md
        - .gitlab-ci.yml
    # Manual trigger from GitLab UI or API
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
